# Local full stack: Postgres + pgvector and the DocuMind container.
#   cp .env.example .env   # add GEMINI_API_KEY (optional)
#   docker compose up --build   ->  http://localhost:8000
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 3s
      retries: 20
  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://documind:documind@db:5432/documind
      CORS_ORIGINS: http://localhost:8000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
